<body>

  <style> 
    /*Making dynamic title text.*/
        /*Custom font.*/
        @font-face {
        font-family: 'TheFont';
        
        /* Link to custom variable font.*/
        src: url("https://garet.typeforward.com/assets/fonts/shared/TFMixVF.woff2")
          format('woff2'); }
    
    
          /*Letter Animation*/
      body.breathe-animation {
        align-items: left;
        justify-content: left;
      }
    
      .breathe-animation span {
        font-family: 'TheFont';
        font-size: 50px;
        margin-bottom: 50px;
        margin-top: -530px;
        margin-left: 35px;
      
      
        /* Change this to set the text color */
        color: white;
      
        /* Center text horizontally */
        text-align: center; 
        animation: letter-breathe 3s ease-in-out infinite;
    }
      
      @keyframes letter-breathe {
       
        from,
        to {
         
          font-variation-settings: 'wght' 100;
        }
    
     
        50% {
          font-variation-settings: 'wght' 900;
        }
      }
      </style>
  </head>
  
  <body class="breathe-animation">
  
    <div style="height: 700px;"></div> <!--MAKES SCROLLABLE-->
  
    <!-- Animated text content-->
    <span>EXPLORE</span>
